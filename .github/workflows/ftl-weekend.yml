name: FTL Weekend Digest

on:
  # Wednesday 13:00 UTC = 9 AM EDT (Mar–Nov) / 8 AM EST (Nov–Mar).
  # GitHub Actions cron is UTC-only (no DST handling), so we pick a UTC time
  # that lands firmly in Fort Lauderdale morning year-round.
  schedule:
    - cron: "0 13 * * 3"
  workflow_dispatch: {}

concurrency:
  group: ftl-weekend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute upcoming weekend window (America/New_York)
        id: weekend
        run: |
          # Target the upcoming Fri–Sun in Fort Lauderdale local time.
          TZ=America/New_York
          export TZ
          DOW=$(date +%u)   # 1=Mon ... 7=Sun
          # Days from today to Fri. Mon(1)→4, Wed(3)→2, Thu(4)→1, Fri(5)→0, Sat(6)→-1, Sun(7)→-2.
          FRI_OFFSET=$((5 - DOW))
          FRI=$(date -d "today + ${FRI_OFFSET} days" +%Y-%m-%d)
          SUN=$(date -d "today + $((FRI_OFFSET + 2)) days" +%Y-%m-%d)
          HUMAN="$(date -d "$FRI" "+%a %b %-d") – $(date -d "$SUN" "+%a %b %-d")"
          echo "fri=$FRI"     >> "$GITHUB_OUTPUT"
          echo "sun=$SUN"     >> "$GITHUB_OUTPUT"
          echo "human=$HUMAN" >> "$GITHUB_OUTPUT"
          echo "Today (ET): $(date +%Y-%m-%d\ %A)  →  Target weekend: $HUMAN ($FRI to $SUN)"

      - name: Curate Fort Lauderdale weekend events with Claude Code
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the "sonnet" alias (not a dated ID) so this always resolves to the
          # current Sonnet generation and never 404s when an old model is retired.
          model: sonnet
          max_turns: "60"
          allowed_tools: "Bash,Write,WebSearch,WebFetch"
          prompt: |
            Find interesting events happening this upcoming weekend (${{ steps.weekend.outputs.human }}, i.e. ${{ steps.weekend.outputs.fri }} through ${{ steps.weekend.outputs.sun }}) in the greater Fort Lauderdale area.

            Cities to cover: Fort Lauderdale, Hollywood, Pompano Beach, Dania Beach, Plantation, Sunrise, Davie, Wilton Manors, Oakland Park, Las Olas, downtown FTL, the beach area. HARD EXCLUDE anything in Miami, South Beach, Coral Gables, Miami Beach, or Brickell — those are NOT greater Fort Lauderdale.

            INCLUDE:
            - Car shows / cars & coffee meetups
            - Comedy shows (stand-up, improv)
            - Theater / stage performances / plays / musicals
            - Festivals, fairs, street markets
            - Grand openings of restaurants, shops, or venues (like the recent Smorgasbord FTL opening)
            - Art walks, gallery openings, museum exhibits
            - Food events (food truck rallies, tasting events, pop-ups)
            - Cultural events, fireworks, parades, unique one-off happenings

            EXCLUDE:
            - Concerts, DJ nights, music festivals, tribute bands, live music events
            - Bar events, club nights, happy hours, wine/beer/cocktail tasting parties
            - Anything primarily centered on drinking or live music

            BUDGET: run AT MOST 9 WebSearch queries and AT MOST 5 WebFetch calls before writing events.json. Good starter queries:
            - "things to do Fort Lauderdale weekend ${{ steps.weekend.outputs.fri }}"
            - "Fort Lauderdale car show ${{ steps.weekend.outputs.fri }}"
            - "Fort Lauderdale Improv comedy ${{ steps.weekend.outputs.fri }}"
            - "Fort Lauderdale grand opening ${{ steps.weekend.outputs.fri }}"
            - "Broward festivals markets this weekend"
            - "Hollywood Pompano Beach events ${{ steps.weekend.outputs.fri }}"
            Prefer WebSearch result snippets over WebFetch. Only fetch a page if the snippets don't give you a specific event URL.

            For EACH event, require ALL of: name, start time, venue, location (city in greater FTL), description, and a SPECIFIC event/ticket URL that deep-links to that event (NOT a generic venue calendar). Drop any event missing any of these. Do not invent details.

            IMPORTANT: as soon as you have 12-16 solid events, STOP searching and WRITE events.json. A list of accurate entries beats a larger one with weak entries.

            OUTPUT: write `events.json` to the repo root (use the Write tool) as a JSON array. Each element:

              {
                "category": "Car shows" | "Comedy" | "Theater" | "Grand openings" | "Festivals" | "Food" | "Art" | "Other",
                "emoji": "🚗" | "🎤" | "🎭" | "🎉" | "🎪" | "🍴" | "🎨" | "📌",
                "name": "Short event name (≤ 60 chars)",
                "when": "Fri May 1, 7:00 PM ET",
                "where": "Venue name · City, FL",
                "what": "One sentence, ≤ 140 chars",
                "cost": "Free" | "$25 per person" | "$15-$50 per person" | "Donation-based" | "Not listed",
                "url": "https://specific-event-page"
              }

            Rules:
            - 10 to 20 events total.
            - Every "url" must be distinct, specific to its event, and load successfully (no 404s). Verify with WebFetch before including if you're unsure.
            - Do NOT include events outside greater Fort Lauderdale (no Miami, South Beach, etc.).
            - Do NOT include concerts, tribute bands, or music-centered events.
            - "when" includes day of week, date, start time, and "ET".
            - "cost" is REQUIRED. Quote the per-person cost: "Free" for no-charge, "$X per person" for ticketed, "$X-$Y per person" for ranges, "Donation-based" for donations, "Not listed" only as last resort. Skip cover charges or food/drink minimums in the cost field — keep cost about admission.
            - Write ONLY valid JSON to events.json — no comments, no code fences, no prose.

            When events.json is written and parses as valid JSON, reply with just "DONE" — nothing else.

      - name: Curate bigger regional events (within ~5h drive) with Claude Code
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: sonnet
          max_turns: "60"
          allowed_tools: "Bash,Write,WebSearch,WebFetch"
          prompt: |
            Find BIGGER, marquee-scale events happening this upcoming weekend (${{ steps.weekend.outputs.human }}, i.e. ${{ steps.weekend.outputs.fri }} through ${{ steps.weekend.outputs.sun }}) that are within roughly a 5-HOUR DRIVE of Fort Lauderdale, FL — in ANY direction.

            GEOGRAPHY: a ~5-hour drive from Fort Lauderdale reaches, among others: West Palm Beach, Boca Raton, Jupiter, Port St. Lucie, Vero Beach, the Florida Keys (Key Largo down toward Key West), Miami, Naples, Fort Myers, Sarasota, Tampa, St. Petersburg, Clearwater, Lakeland, Orlando, Kissimmee, Daytona Beach, Melbourne, and Cocoa Beach. Anything within about 5 hours by car qualifies. EXCLUDE events that are essentially in the immediate greater Fort Lauderdale / Broward area (those go in the separate local digest) — focus on destinations worth a drive.

            "BIGGER" means larger-scale or marquee draws, e.g.: major festivals and fairs, big-name touring comedy, Broadway-caliber / national touring theater and musicals, large car shows and auto expos, theme-park special events and seasonal celebrations, major street festivals, big food & cultural festivals, marquee grand openings, fireworks spectaculars, and notable one-off happenings. Prefer events with regional/statewide significance over small local meetups.

            INCLUDE (same spirit as the local digest, but bigger):
            - Car shows / auto expos
            - Comedy shows (stand-up, improv) — especially touring headliners
            - Theater / stage performances / plays / musicals — especially national tours
            - Festivals, fairs, street markets (large-scale)
            - Grand openings of notable restaurants, shops, attractions, or venues
            - Art walks, gallery openings, museum exhibits, major art shows
            - Food events (food & wine festivals, big tasting events, pop-ups)
            - Cultural events, fireworks, parades, theme-park celebrations, unique one-off happenings

            EXCLUDE:
            - Concerts, DJ nights, music festivals, tribute bands, live music events
            - Bar events, club nights, happy hours, wine/beer/cocktail tasting parties
            - Anything primarily centered on drinking or live music

            BUDGET: run AT MOST 9 WebSearch queries and AT MOST 5 WebFetch calls before writing events-regional.json. Good starter queries:
            - "biggest events Florida weekend ${{ steps.weekend.outputs.fri }}"
            - "Orlando festivals this weekend ${{ steps.weekend.outputs.fri }}"
            - "Tampa St Petersburg events ${{ steps.weekend.outputs.fri }}"
            - "West Palm Beach festival ${{ steps.weekend.outputs.fri }}"
            - "Fort Myers Naples Sarasota events this weekend"
            - "Florida Keys events ${{ steps.weekend.outputs.fri }}"
            Prefer WebSearch result snippets over WebFetch. Only fetch a page if the snippets don't give you a specific event URL.

            For EACH event, require ALL of: name, start time, venue, location (city + how far / which metro), description, and a SPECIFIC event/ticket URL that deep-links to that event (NOT a generic venue calendar). Drop any event missing any of these. Do not invent details.

            IMPORTANT: as soon as you have 8-12 solid events, STOP searching and WRITE events-regional.json. A list of accurate entries beats a larger one with weak entries.

            OUTPUT: write `events-regional.json` to the repo root (use the Write tool) as a JSON array. Each element:

              {
                "category": "Car shows" | "Comedy" | "Theater" | "Grand openings" | "Festivals" | "Food" | "Art" | "Other",
                "emoji": "🚗" | "🎤" | "🎭" | "🎉" | "🎪" | "🍴" | "🎨" | "📌",
                "name": "Short event name (≤ 60 chars)",
                "when": "Fri May 1, 7:00 PM ET",
                "where": "Venue name · City, FL (≈Xh from FTL)",
                "what": "One sentence, ≤ 140 chars",
                "cost": "Free" | "$25 per person" | "$15-$50 per person" | "Donation-based" | "Not listed",
                "url": "https://specific-event-page"
              }

            Rules:
            - 8 to 14 events total.
            - Every "url" must be distinct, specific to its event, and load successfully (no 404s). Verify with WebFetch before including if you're unsure.
            - Stay within ~5 hours' drive of Fort Lauderdale; do NOT include events in the immediate Broward / greater Fort Lauderdale area (those belong in the local digest).
            - Do NOT include concerts, tribute bands, or music-centered events.
            - "when" includes day of week, date, start time, and "ET".
            - In "where", note the approximate drive time from Fort Lauderdale (e.g. "≈3h from FTL").
            - "cost" is REQUIRED. Quote the per-person cost: "Free" for no-charge, "$X per person" for ticketed, "$X-$Y per person" for ranges, "Donation-based" for donations, "Not listed" only as last resort. Skip cover charges or food/drink minimums in the cost field — keep cost about admission.
            - Write ONLY valid JSON to events-regional.json — no comments, no code fences, no prose.

            When events-regional.json is written and parses as valid JSON, reply with just "DONE" — nothing else.

      - name: Validate events JSON files
        run: |
          for f in events.json events-regional.json; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty"
              ls -la
              exit 1
            fi
            if ! jq empty "$f"; then
              echo "::error::$f is not valid JSON"
              cat "$f"
              exit 1
            fi
            echo "Curated $(jq 'length' "$f") events in $f (pre URL-check)"
          done

      - name: Verify event URLs respond
        id: validate
        run: |
          UA="Mozilla/5.0 (compatible; ftl-weekend-digest/1.0)"
          check_file() {
            local src="$1"
            echo "[]" > "$src.valid"
            while IFS= read -r event; do
              url=$(jq -r '.url' <<<"$event")
              name=$(jq -r '.name' <<<"$event")
              # Try HEAD first. Some sites reject HEAD or block bots, so fall back to GET.
              code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 10 -A "$UA" -I "$url" 2>/dev/null || echo "000")
              if [ "$code" = "405" ] || [ "$code" = "000" ] || [ "$code" -ge 400 ]; then
                code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 15 -A "$UA" "$url" 2>/dev/null || echo "000")
              fi
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
                echo "  KEEP $code  $name"
                jq --argjson e "$event" '. += [$e]' "$src.valid" > "$src.tmp" \
                  && mv "$src.tmp" "$src.valid"
              else
                echo "  DROP $code  $name  ::  $url"
              fi
            done < <(jq -c '.[]' "$src")
            mv "$src.valid" "$src"
          }

          echo "== Local Fort Lauderdale events =="
          check_file events.json
          echo "== Bigger regional events =="
          check_file events-regional.json

          COUNT=$(jq 'length' events.json)
          COUNT_REGIONAL=$(jq 'length' events-regional.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "count_regional=$COUNT_REGIONAL" >> "$GITHUB_OUTPUT"
          echo "Reachable local events: $COUNT · regional events: $COUNT_REGIONAL"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No local events with reachable URLs after validation"
          fi
          if [ "$COUNT_REGIONAL" -eq 0 ]; then
            echo "::warning::No regional events with reachable URLs after validation"
          fi

      - name: Render HTML digests into ./site
        env:
          HUMAN: ${{ steps.weekend.outputs.human }}
          FRI: ${{ steps.weekend.outputs.fri }}
          SUN: ${{ steps.weekend.outputs.sun }}
        run: |
          mkdir -p site
          GENERATED_AT=$(TZ=America/New_York date "+%a %b %-d, %-I:%M %p ET")

          # Render one HTML page from a given events JSON file.
          # Args: <events-json> <out-html> <page-title> <page-heading> <other-link-href> <other-link-label>
          render_page() {
            local src="$1" out="$2" title="$3" heading="$4" other_href="$5" other_label="$6"

            local EVENTS_HTML
            EVENTS_HTML=$(jq -r '
              group_by(.category)
              | map({category: .[0].category, emoji: .[0].emoji, items: .})
              | .[]
              | "<section class=\"cat\">"
                + "<h2>" + (.emoji // "") + " " + .category + "</h2>"
                + "<ul>"
                + ([.items[] |
                    "<li><a href=\"" + .url + "\" target=\"_blank\" rel=\"noopener\">"
                    + "<div class=\"name\">" + .name + "</div>"
                    + "<div class=\"meta\">" + .when + " · " + .where + "</div>"
                    + "<div class=\"desc\">" + .what + "</div>"
                    + "<div class=\"cost\">" + (.cost // "Cost not listed") + "</div>"
                    + "</a></li>"
                  ] | join("\n"))
                + "</ul>"
                + "</section>"
            ' "$src")

            cat > "$out" <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex">
          <title>${title}</title>
          <style>
            :root {
              --bg: #0f1115; --panel: #161922; --line: #262b36;
              --text: #e9ecf1; --muted: #9aa3b2; --accent: #6cb6ff;
            }
            @media (prefers-color-scheme: light) {
              :root { --bg:#fafafa; --panel:#fff; --line:#e5e7eb; --text:#101418; --muted:#5b6573; --accent:#0a66c2; }
            }
            * { box-sizing: border-box; }
            html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
              font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
            .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
            header h1 { font-size: 22px; margin: 0 0 4px; }
            header .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
            .switch { display: inline-block; margin-bottom: 24px; font-size: 14px; }
            .switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
            section.cat { margin: 24px 0; }
            section.cat h2 { font-size: 18px; margin: 0 0 8px; padding-bottom: 6px;
              border-bottom: 1px solid var(--line); }
            ul { list-style: none; padding: 0; margin: 0; }
            li { margin: 0 0 10px; }
            li a { display: block; padding: 14px 16px; background: var(--panel);
              border: 1px solid var(--line); border-radius: 12px;
              color: var(--text); text-decoration: none; transition: border-color .15s; }
            li a:active, li a:hover { border-color: var(--accent); }
            .name { font-weight: 600; font-size: 16px; }
            .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
            .desc { font-size: 14px; margin-top: 6px; }
            .cost { font-size: 13px; margin-top: 6px; color: var(--accent); font-weight: 600; }
            footer { color: var(--muted); font-size: 12px; margin-top: 32px; text-align: center; }
            footer a { color: var(--muted); }
          </style>
          </head>
          <body>
            <div class="wrap">
              <header>
                <h1>${heading}</h1>
                <div class="sub">Tap any event to open its page · Generated ${GENERATED_AT}</div>
                <div class="switch"><a href="${other_href}">${other_label} →</a></div>
              </header>
              ${EVENTS_HTML}
              <footer>
                Auto-curated weekly · <a href="https://github.com/dangershuny/ftl-weekend-digest" target="_blank" rel="noopener">source</a>
              </footer>
            </div>
          </body>
          </html>
          HTML
            echo "Generated $out ($(wc -c < "$out") bytes)"
          }

          render_page events.json site/index.html \
            "FTL Weekend — ${HUMAN}" \
            "Greater Fort Lauderdale — ${HUMAN}" \
            "regional.html" "Bigger events within a 5-hour drive"

          render_page events-regional.json site/regional.html \
            "Within 5h of FTL — ${HUMAN}" \
            "Bigger events within ~5h of Fort Lauderdale — ${HUMAN}" \
            "index.html" "Back to Fort Lauderdale weekend"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Push ntfy notifications
        env:
          NTFY_TOPIC: daniel-weekly-notifications-1993
          HUMAN: ${{ steps.weekend.outputs.human }}
          COUNT: ${{ steps.validate.outputs.count }}
          COUNT_REGIONAL: ${{ steps.validate.outputs.count_regional }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # The deploy-pages page_url is the base (ends with "/").
          LOCAL_URL="$PAGE_URL"
          REGIONAL_URL="${PAGE_URL}regional.html"

          # --- Notification 1: local Fort Lauderdale events ---
          EVENT_LIST=$(jq -r '.[] | "\(.emoji // "•") \(.name)  ·  \(.cost // "Cost not listed")"' events.json)
          BODY=$(printf '%s events for %s — tap to open or follow the link below.\n\n%s\n\nFull details, addresses, and per-event tickets:\n%s' \
                  "$COUNT" "$HUMAN" "$EVENT_LIST" "$LOCAL_URL")
          curl -sS --fail \
            -H "Title: FTL Weekend — $HUMAN" \
            -H "Tags: calendar" \
            -H "Priority: default" \
            -H "Click: $LOCAL_URL" \
            -H "Actions: view, Open digest, $LOCAL_URL, clear=true" \
            -H "Content-Type: text/plain; charset=utf-8" \
            --data "$BODY" \
            "https://ntfy.sh/$NTFY_TOPIC"
          echo
          echo "Sent local notification → $LOCAL_URL"

          # --- Notification 2: bigger events within a 5-hour drive ---
          EVENT_LIST_REGIONAL=$(jq -r '.[] | "\(.emoji // "•") \(.name)  ·  \(.cost // "Cost not listed")"' events-regional.json)
          BODY_REGIONAL=$(printf '%s bigger events within ~5h of Fort Lauderdale for %s — worth the drive.\n\n%s\n\nFull details, addresses, and per-event tickets:\n%s' \
                  "$COUNT_REGIONAL" "$HUMAN" "$EVENT_LIST_REGIONAL" "$REGIONAL_URL")
          curl -sS --fail \
            -H "Title: Bigger events near FTL (≤5h drive) — $HUMAN" \
            -H "Tags: car,calendar" \
            -H "Priority: default" \
            -H "Click: $REGIONAL_URL" \
            -H "Actions: view, Open regional digest, $REGIONAL_URL, clear=true" \
            -H "Content-Type: text/plain; charset=utf-8" \
            --data "$BODY_REGIONAL" \
            "https://ntfy.sh/$NTFY_TOPIC"
          echo
          echo "Sent regional notification → $REGIONAL_URL"

      # Safety net: if ANY step above failed, tell the user instead of failing
      # silently. This is why the digest could break for weeks unnoticed.
      - name: Notify on failure
        if: failure()
        env:
          NTFY_TOPIC: daniel-weekly-notifications-1993
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS \
            -H "Title: ⚠️ FTL Weekend Digest failed" \
            -H "Tags: warning" \
            -H "Priority: high" \
            -H "Click: $RUN_URL" \
            -H "Content-Type: text/plain; charset=utf-8" \
            --data "This week's Fort Lauderdale digest did not send — a step failed. Tap to view the run log." \
            "https://ntfy.sh/$NTFY_TOPIC" || true
